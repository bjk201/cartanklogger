<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CarTankLogger{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <meta name="csrf-token" content="{{ csrf_token() if csrf_token else '' }}">
    
    <!-- Inline theme init BEFORE body render - prevents flash -->
    <script>
    (function() {
        try {
            var saved = localStorage.getItem('theme');
            if (saved === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else if (saved === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        } catch (e) {}
    })();
    </script>
</head>
<body>

<header class="app-header fixed-top">
  <div class="container-fluid px-3">
    <div class="d-flex align-items-center justify-content-between py-2 flex-wrap gap-2">
      
      <!-- Brand -->
      <span class="navbar-brand mb-0 h1">⚡ CarTankLogger</span>
      
      <!-- Navigation (Desktop) -->
      <nav class="d-none d-md-flex align-items-center gap-1" id="mainNav">
        <div class="btn-group btn-group-sm" role="group" aria-label="Hauptnavigation">
          <a class="btn {% if request.path == '/' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="/">Übersicht</a>
          <a class="btn {% if request.path == '/statistik' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="/statistik">Statistik</a>
          <a class="btn {% if request.path == '/monatsvergleich' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="/monatsvergleich">Monatsvergleich</a>
          <a class="btn {% if request.path == '/extra' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="/extra">Extra-Kosten</a>
          <a class="btn {% if request.path == '/evcc' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="/evcc">EVCC</a>
          <a class="btn {% if request.path == '/teslamate' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="/teslamate">TeslaMate</a>
          <a class="btn {% if request.path == '/admin' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="/admin">Admin</a>
        </div>
      </nav>
      
      <!-- Mobile menu button -->
      <button class="sidebar-toggle d-md-none" id="sidebarToggle" aria-label="Menü öffnen">
        <i class="bi bi-list"></i>
      </button>
      
      <!-- Theme Toggle + Date Range (right side) -->
      <div class="d-flex align-items-center gap-2">
        
        <!-- Theme Toggle -->
        <button class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" id="themeToggle" title="Theme wechseln">
          <i class="bi bi-moon-fill" id="themeIcon"></i>
          <span id="themeLabel" class="d-none d-sm-inline">Dark</span>
        </button>
        
        <!-- Date Range Selector -->
        <div class="d-none d-sm-flex align-items-center gap-1" id="globalDateRange">
          <span class="text-muted small" id="globalRangeLabel">Letzte 365 Tage</span>
          <div class="btn-group btn-group-sm" role="group">
            <button class="btn btn-outline-secondary" data-days="1">1 Tag</button>
            <button class="btn btn-outline-secondary" data-days="30">30 Tage</button>
            <button class="btn btn-outline-secondary active" data-days="90">90 Tage</button>
            <button class="btn btn-outline-secondary" data-days="365">Jahr</button>
            <button class="btn btn-outline-secondary" data-days="9999">Alle</button>
          </div>
          <div class="input-group input-group-sm d-none d-lg-flex ms-1" style="width:auto">
            <span class="input-group-text">Von</span>
            <input type="date" id="globalRangeFrom" class="form-control form-control-sm" style="width:110px">
            <span class="input-group-text">Bis</span>
            <input type="date" id="globalRangeTo" class="form-control form-control-sm" style="width:110px">
            <button class="btn btn-outline-primary" id="globalRangeApply" type="button">Anwenden</button>
          </div>
        </div>
        
      </div>
    </div>
  </div>
</header>

<!-- Sidebar overlay (mobile) -->
<div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

<nav class="sidebar-mobile d-md-none" id="sidebarMobile" style="position: fixed; top: 56px; left: 0; right: 0; bottom: 0; z-index: 1040; background: var(--bs-body-bg); transform: translateX(-100%); transition: transform 0.3s ease; overflow-y: auto;">
  <div class="p-3">
    <ul class="nav flex-column gap-1">
      <li><a class="nav-link btn btn-sm {% if request.path == '/' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="/">Übersicht</a></li>
      <li><a class="nav-link btn btn-sm {% if request.path == '/statistik' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="/statistik">Statistik</a></li>
      <li><a class="nav-link btn btn-sm {% if request.path == '/monatsvergleich' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="/monatsvergleich">Monatsvergleich</a></li>
      <li><a class="nav-link btn btn-sm {% if request.path == '/extra' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="/extra">Extra-Kosten</a></li>
      <li><a class="nav-link btn btn-sm {% if request.path == '/evcc' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="/evcc">EVCC</a></li>
      <li><a class="nav-link btn btn-sm {% if request.path == '/teslamate' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="/teslamate">TeslaMate</a></li>
      <li><a class="nav-link btn btn-sm {% if request.path == '/admin' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="/admin">Admin</a></li>
    </ul>
    <div class="mt-3 pt-3 border-top">
      <button class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2" id="themeToggleMobile">
        <i class="bi bi-moon-fill" id="themeIconMobile"></i>
        <span id="themeLabelMobile">Dark Mode</span>
      </button>
    </div>
  </div>
</nav>

<div class="container-fluid pt-0">
  <div class="row g-0">
    <!-- MAIN CONTENT -->
    <main class="col-12 py-3">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script>
// Theme toggle - runs immediately after DOM ready
function initTheme() {
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');
  const themeLabel = document.getElementById('themeLabel');
  const themeToggleMobile = document.getElementById('themeToggleMobile');
  const themeIconMobile = document.getElementById('themeIconMobile');
  const themeLabelMobile = document.getElementById('themeLabelMobile');
  
  // Already set by inline script in head, just update UI
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  function updateUI(isDark) {
    if (themeIcon) themeIcon.className = isDark ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
    if (themeLabel) themeLabel.textContent = isDark ? 'Light' : 'Dark';
    if (themeIconMobile) themeIconMobile.className = isDark ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
    if (themeLabelMobile) themeLabelMobile.textContent = isDark ? 'Light Mode' : 'Dark Mode';
  }
  updateUI(isDark);
  
  function toggleTheme() {
    const newDark = document.documentElement.getAttribute('data-theme') !== 'dark';
    document.documentElement.setAttribute('data-theme', newDark ? 'dark' : 'light');
    localStorage.setItem('theme', newDark ? 'dark' : 'light');
    updateUI(newDark);
  }
  
  if (themeToggle) themeToggle.addEventListener('click', toggleTheme);
  if (themeToggleMobile) themeToggleMobile.addEventListener('click', toggleTheme);
}

// Mobile sidebar toggle
function initSidebar() {
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebar = document.getElementById('sidebarMobile');
  const overlay = document.getElementById('sidebarOverlay');
  
  if (!sidebarToggle || !sidebar || !overlay) return;
  
  function openSidebar() {
    sidebar.style.transform = 'translateX(0)';
    overlay.classList.add('show');
    sidebarToggle.innerHTML = '<i class="bi bi-x-lg"></i>';
    sidebarToggle.setAttribute('aria-label', 'Menü schließen');
    document.body.style.overflow = 'hidden';
  }
  
  function closeSidebar() {
    sidebar.style.transform = 'translateX(-100%)';
    overlay.classList.remove('show');
    sidebarToggle.innerHTML = '<i class="bi bi-list"></i>';
    sidebarToggle.setAttribute('aria-label', 'Menü öffnen');
    document.body.style.overflow = '';
  }
  
  sidebarToggle.addEventListener('click', function() {
    if (sidebar.style.transform === 'translateX(0)') closeSidebar();
    else openSidebar();
  });
  
  overlay.addEventListener('click', closeSidebar);
  
  // Close sidebar when clicking a nav link on mobile
  document.querySelectorAll('.sidebar-mobile .nav-link').forEach(link => {
    link.addEventListener('click', closeSidebar);
  });
  
  // Close sidebar on window resize to desktop
  window.addEventListener('resize', function() {
    if (window.innerWidth >= 768 && sidebar.style.transform === 'translateX(0)') closeSidebar();
  });
}

// Global shared date range state
let globalDateRange = {
  days: 90,
  from: null,
  to: null
};

function getGlobalRangeParams() {
  if (globalDateRange.from && globalDateRange.to) {
    return `from=${encodeURIComponent(globalDateRange.from)}&to=${encodeURIComponent(globalDateRange.to)}`;
  }
  return `days=${globalDateRange.days}`;
}

function updateGlobalRangeLabel() {
  const el = document.getElementById('globalRangeLabel');
  if (!el) return;
  if (globalDateRange.from && globalDateRange.to) {
    el.textContent = `${globalDateRange.from} bis ${globalDateRange.to}`;
  } else if (globalDateRange.days >= 9999) {
    el.textContent = 'Alle Daten';
  } else {
    el.textContent = `Letzte ${globalDateRange.days} Tage`;
  }
}

function initGlobalDateRange() {
  // Load saved state
  try {
    const saved = localStorage.getItem('globalDateRange');
    if (saved) {
      globalDateRange = JSON.parse(saved);
    }
  } catch (e) {}
  
  // Update button states
  document.querySelectorAll('[data-days]').forEach(btn => {
    const days = parseInt(btn.getAttribute('data-days'), 10);
    if (globalDateRange.from && globalDateRange.to) {
      btn.classList.remove('active');
    } else if (days === globalDateRange.days) {
      btn.classList.add('active');
    }
  });
  
  // Update date inputs
  const fromEl = document.getElementById('globalRangeFrom');
  const toEl = document.getElementById('globalRangeTo');
  if (fromEl && globalDateRange.from) fromEl.value = globalDateRange.from;
  if (toEl && globalDateRange.to) toEl.value = globalDateRange.to;
  
  updateGlobalRangeLabel();
  
  // Day buttons
  document.querySelectorAll('[data-days]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-days]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      globalDateRange.days = parseInt(btn.getAttribute('data-days'), 10);
      globalDateRange.from = null;
      globalDateRange.to = null;
      if (fromEl) fromEl.value = '';
      if (toEl) toEl.value = '';
      saveGlobalRange();
      updateGlobalRangeLabel();
      notifyRangeChange();
    });
  });
  
  // Apply custom range
  const applyBtn = document.getElementById('globalRangeApply');
  if (applyBtn) {
    applyBtn.addEventListener('click', () => {
      const from = fromEl?.value;
      const to = toEl?.value;
      if (!from || !to) {
        alert('Bitte Von- und Bis-Datum wählen.');
        return;
      }
      document.querySelectorAll('[data-days]').forEach(b => b.classList.remove('active'));
      globalDateRange.from = from;
      globalDateRange.to = to;
      saveGlobalRange();
      updateGlobalRangeLabel();
      notifyRangeChange();
    });
  }
}

function saveGlobalRange() {
  try {
    localStorage.setItem('globalDateRange', JSON.stringify(globalDateRange));
  } catch (e) {}
}

// Notify all pages about range change
function notifyRangeChange() {
  // Dispatch custom event that pages can listen to
  window.dispatchEvent(new CustomEvent('globalRangeChange', { detail: getGlobalRangeParams() }));
  
  // Also trigger reload on current page if it has load function
  if (typeof loadAll === 'function') loadAll();
  if (typeof loadOverview === 'function') loadOverview();
  if (typeof loadStats === 'function') loadStats();
  if (typeof loadEVCC === 'function') loadEVCC();
  if (typeof loadTM === 'function') loadTM();
  if (typeof loadExtra === 'function') loadExtra();
}

document.addEventListener('DOMContentLoaded', function() {
  initTheme();
  initSidebar();
  initGlobalDateRange();
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>

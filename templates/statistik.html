{% extends "base.html" %}
{% block title %}CarTankLogger – Statistik{% endblock %}
{% block content %}

<!-- ===== Zeitraum-Auswahl ===== -->
<div class="row mb-3">
  <div class="col-12 col-md-6">
    <div class="d-flex align-items-center gap-2">
      <span class="text-muted small">Zeitraum:</span>
      <div class="btn-group btn-group-sm" role="group">
        <button class="btn btn-outline-secondary" data-days="7">7 Tage</button>
        <button class="btn btn-outline-secondary active" data-days="30">30 Tage</button>
        <button class="btn btn-outline-secondary" data-days="90">90 Tage</button>
        <button class="btn btn-outline-secondary" data-days="365">Jahr</button>
        <button class="btn btn-outline-secondary" data-days="9999">Alle</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== KPI Row ===== -->
<div class="row g-2 mb-3" id="statsKpis"></div>

<!-- ===== Charts Grid ===== -->
<div class="row g-3">
  <!-- Verbrauch Chart -->
  <div class="col-lg-6">
    <div class="card dashboard-card stats-chart-card">
      <div class="card-header py-2 d-flex align-items-center justify-content-between">
        <span>⚡ Verbrauch (kWh/100 km)</span>
        <div class="chart-controls">
          <select class="chart-type-select" data-chart="chartCons">
            <option value="line">Linie</option>
            <option value="bar">Balken</option>
          </select>
          <select class="average-mode-select" data-chart="chartCons">
            <option value="mean">Ø Zeitraum</option>
            <option value="moving">Gleitender Ø</option>
            <option value="off">Ohne Ø</option>
          </select>
        </div>
      </div>
      <div class="card-body py-2">
        <canvas id="chartCons"></canvas>
      </div>
    </div>
  </div>

  <!-- Energiepreis Chart -->
  <div class="col-lg-6">
    <div class="card dashboard-card stats-chart-card">
      <div class="card-header py-2 d-flex align-items-center justify-content-between">
        <span>💶 Energiepreis (€/kWh)</span>
        <div class="chart-controls">
          <select class="chart-type-select" data-chart="chartPrice">
            <option value="line">Linie</option>
            <option value="bar">Balken</option>
          </select>
          <select class="average-mode-select" data-chart="chartPrice">
            <option value="mean">Ø Zeitraum</option>
            <option value="moving">Gleitender Ø</option>
            <option value="off">Ohne Ø</option>
          </select>
        </div>
      </div>
      <div class="card-body py-2">
        <canvas id="chartPrice"></canvas>
      </div>
    </div>
  </div>

  <!-- Kosten Chart -->
  <div class="col-lg-6">
    <div class="card dashboard-card stats-chart-card">
      <div class="card-header py-2 d-flex align-items-center justify-content-between">
        <span>💡 Kosten (€/100 km)</span>
        <div class="chart-controls">
          <select class="chart-type-select" data-chart="chartCost100">
            <option value="line">Linie</option>
            <option value="bar">Balken</option>
          </select>
          <select class="average-mode-select" data-chart="chartCost100">
            <option value="mean">Ø Zeitraum</option>
            <option value="moving">Gleitender Ø</option>
            <option value="off">Ohne Ø</option>
          </select>
        </div>
      </div>
      <div class="card-body py-2">
        <canvas id="chartCost100"></canvas>
      </div>
    </div>
  </div>

  <!-- Kilometer Chart -->
  <div class="col-lg-6">
    <div class="card dashboard-card stats-chart-card">
      <div class="card-header py-2 d-flex align-items-center justify-content-between">
        <span>🛣️ Kilometer (kumuliert)</span>
        <div class="chart-controls">
          <select class="chart-type-select" data-chart="chartKm">
            <option value="line">Linie</option>
            <option value="bar">Balken</option>
          </select>
          <select class="average-mode-select" data-chart="chartKm">
            <option value="mean">Ø Zeitraum</option>
            <option value="moving">Gleitender Ø</option>
            <option value="off">Ohne Ø</option>
          </select>
        </div>
      </div>
      <div class="card-body py-2">
        <canvas id="chartKm"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- ===== Heatmap Grid ===== -->
<div class="row g-3 mt-3">
  <div class="col-12 col-md-6">
    <div class="card dashboard-card heatmap-card">
      <div class="card-header py-2 d-flex align-items-center justify-content-between">
        <span class="fw-medium small">🌡️ Verbrauch / Temperatur</span>
        <button class="btn btn-sm btn-outline-secondary p-0" data-bs-toggle="tooltip" title="Anzahl Fahrten pro Temperatur- & Verbrauchsbereich"><i class="bi bi-info-circle"></i></button>
      </div>
      <div class="card-body py-2">
        <canvas id="heatmapTempConsumption" style="height: 180px;"></canvas>
        <div class="mt-2 small" id="legendTempConsumption"></div>
      </div>
    </div>
  </div>

  <div class="col-12 col-md-6">
    <div class="card dashboard-card heatmap-card">
      <div class="card-header py-2 d-flex align-items-center justify-content-between">
        <span class="fw-medium small">📅 Verbrauch / Wochentag</span>
        <button class="btn btn-sm btn-outline-secondary p-0" data-bs-toggle="tooltip" title="Anzahl Fahrten pro Wochentag & Verbrauchsbereich"><i class="bi bi-info-circle"></i></button>
      </div>
      <div class="card-body py-2">
        <canvas id="heatmapWeekdayConsumption" style="height: 180px;"></canvas>
        <div class="mt-2 small" id="legendWeekdayConsumption"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/statistik.js') }}?v={{ js_version }}"></script>
{% endblock %}

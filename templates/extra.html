{% extends "base.html" %}
{% block title %}CarTankLogger – Extra-Kosten{% endblock %}
{% block content %}

<div class="card">
  <div class="card-header py-2 d-flex align-items-center justify-content-between">
    <span>💰 Extra-Kosten</span>
    <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#addExtraModal">➕ Neu</button>
  </div>
  <div class="card-body p-0">
    <div class="table-container">
      <table class="table table-sm table-striped align-middle mb-0" id="tblExtra">
        <thead class="sticky-header"><tr>
          <th>Datum</th><th>Kategorie</th><th>Beschreibung</th><th>€</th><th>KM-Stand</th><th>Aktion</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <div class="card-footer py-2">
    <nav id="pagination" aria-label="Pagination"></nav>
  </div>
</div>

<!-- Add Extra Modal -->
<div class="modal fade" id="addExtraModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title">Extra-Kosten hinzufügen</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="extraForm">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-2 mb-2">
            <div class="col-6">
              <label class="form-label small" for="date">Datum</label>
              <input type="date" class="form-control form-control-sm" id="date" name="date" required>
            </div>
            <div class="col-6">
              <label class="form-label small" for="category">Kategorie</label>
              <select class="form-select form-select-sm" id="category" name="category" required>
                <option value="purchase">Anschaffung</option>
                <option value="service">Service</option>
                <option value="accessory">Zubehör</option>
                <option value="insurance">Versicherung</option>
                <option value="tax">Steuer</option>
                <option value="other">Sonstiges</option>
              </select>
            </div>
          </div>
          <div class="mb-2">
            <label class="form-label small" for="description">Beschreibung</label>
            <input type="text" class="form-control form-control-sm" id="description" name="description">
          </div>
          <div class="mb-2">
            <label class="form-label small" for="amount">Betrag €</label>
            <input type="number" class="form-control form-control-sm" id="amount" name="amount" step="0.01" min="0" required>
          </div>
          <div class="mb-2">
            <label class="form-label small" for="odometer">KM-Stand</label>
            <input type="number" class="form-control form-control-sm" id="odometer" name="odometer" step="1">
          </div>
          <div class="mb-2">
            <label class="form-label small" for="note">Notiz</label>
            <input type="text" class="form-control form-control-sm" id="note" name="note">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Abbrechen</button>
        <button type="button" class="btn btn-primary btn-sm" id="saveExtraBtn">Speichern</button>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/shared-modal.js') }}?v={{ js_version }}"></script>
<script src="{{ url_for('static', filename='js/extra.js') }}?v={{ js_version }}"></script>
{% endblock %}
